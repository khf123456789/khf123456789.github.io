<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box 読み込み試験</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;margin:16px;max-width:760px;background:#fff;color:#222}
input{width:100%;padding:6px;font:inherit;box-sizing:border-box;margin:2px 0 8px}
button{font:inherit;padding:6px 14px;margin:4px 4px 4px 0}
pre{background:#f3f3f3;padding:8px;white-space:pre-wrap;word-break:break-all}
li{cursor:pointer;color:#0645ad}
</style></head><body>
<h3>Box 読み込み試験</h3>
<label>Client ID<input id="cid"></label>
<label>Client Secret<input id="sec" type="password"></label>
<button id="login">Box にログイン</button>
<button id="list">鉄骨ビューアのフォルダを見る</button>
<button id="refresh">トークン更新を試す</button>
<button id="clear">覚えた物を消す</button>
<ul id="items"></ul>
<pre id="log"></pre>
<script>
const $ = id => document.getElementById(id);
const RED = location.origin + location.pathname;
const log = s => { $('log').textContent += s + '\n'; };
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
$('cid').value = ls('bx_cid') || ''; $('sec').value = ls('bx_sec') || '';
$('cid').onchange = () => ls('bx_cid', $('cid').value.trim());
$('sec').onchange = () => ls('bx_sec', $('sec').value.trim());

$('login').onclick = () => {
  ls('bx_cid', $('cid').value.trim()); ls('bx_sec', $('sec').value.trim());
  const st = Math.random().toString(36).slice(2); ls('bx_state', st);
  location.href = 'https://account.box.com/api/oauth2/authorize?response_type=code&client_id=' + encodeURIComponent(ls('bx_cid'))
    + '&redirect_uri=' + encodeURIComponent(RED) + '&state=' + st;
};

async function token(body) {
  const p = new URLSearchParams(Object.assign({ client_id: ls('bx_cid'), client_secret: ls('bx_sec') }, body));
  let r;
  try { r = await fetch('https://api.box.com/oauth2/token', { method: 'POST', body: p }); }
  catch (e) { log('×トークンの取得で失敗（ブラウザが止めた＝CORS の可能性）: ' + e); return null; }
  const j = await r.json(); if (!r.ok) { log('×トークン: ' + r.status + ' ' + JSON.stringify(j)); return null; }
  ls('bx_at', j.access_token); ls('bx_rt', j.refresh_token); ls('bx_exp', String(Date.now() + j.expires_in * 1000));
  log('○トークン取得（有効 ' + j.expires_in + ' 秒）'); return j;
}
async function api(path, raw) {
  let r;
  try { r = await fetch('https://api.box.com/2.0' + path, { headers: { Authorization: 'Bearer ' + ls('bx_at') } }); }
  catch (e) { log('×' + path + ' で失敗（CORS の可能性）: ' + e); return null; }
  if (!r.ok) { log('×' + path + ' ' + r.status + ' ' + await r.text()); return null; }
  return raw ? r : r.json();
}
async function showFolder(id, name) {
  const j = await api('/folders/' + id + '/items?fields=id,name,type,size&limit=1000'); if (!j) return;
  log('○フォルダ「' + name + '」 ' + j.entries.length + ' 件');
  $('items').innerHTML = '';
  for (const e of j.entries) {
    const li = document.createElement('li');
    li.textContent = (e.type === 'folder' ? '📁 ' : '📄 ') + e.name + (e.size != null ? '（' + e.size + ' バイト）' : '');
    li.onclick = () => e.type === 'folder' ? showFolder(e.id, e.name) : download(e);
    $('items').appendChild(li);
  }
}
async function download(e) {
  const t0 = performance.now(); log('読み込み中… ' + e.name);
  const r = await api('/files/' + e.id + '/content', true); if (!r) return;
  const b = await r.arrayBuffer();
  log('○ファイル読めた: ' + e.name + ' ' + b.byteLength + ' バイト ' + Math.round(performance.now() - t0) + ' ms');
}
$('list').onclick = async () => {
  const j = await api('/search?query=' + encodeURIComponent('鉄骨ビューア') + '&type=folder&fields=id,name');
  let f = j && j.entries.find(x => x.name === '鉄骨ビューア');
  if (!f) { log('検索で見つからないので一番上を見ます'); return showFolder('0', 'すべてのファイル'); }
  showFolder(f.id, f.name);
};
$('refresh').onclick = () => token({ grant_type: 'refresh_token', refresh_token: ls('bx_rt') });
$('clear').onclick = () => { ['bx_cid', 'bx_sec', 'bx_at', 'bx_rt', 'bx_exp', 'bx_state'].forEach(k => ls(k, null)); location.href = RED; };

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) log('×ログイン: ' + q.get('error') + ' ' + (q.get('error_description') || ''));
  if (q.get('code')) {
    if (q.get('state') !== ls('bx_state')) log('×state が違う');
    else if (await token({ grant_type: 'authorization_code', code: q.get('code') })) $('list').click();
    history.replaceState(null, '', RED);
  } else if (ls('bx_at')) log('前のトークンがあります（「フォルダを見る」で試せます）');
})();
</script></body></html>
