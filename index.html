<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鉄骨ビューア</title>
<style>
/* 画面：上にバー、真ん中に 3D、下に道具。左は製品一覧（引き出し）、図面は全画面で重ねる */
:root{
  --bar:#16324f; --bar-fg:#f3f6fa; --bg:#eef1f4; --panel:#ffffff; --fg:#1d2733; --muted:#5d6b7a; --line:#d5dce4;
  --accent:#e8711a; --accent-fg:#ffffff; --sel:#fde7d4; --chip:#eef2f6;
  --f-ui:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; --f-num:"Roboto Mono","Consolas",ui-monospace,monospace;
  --dv-bg:#0b0d10; --dv-fg:#f3f6fa; --dv-accent:#e8711a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#0f2238;--bg:#151a20;--panel:#1d242c;--fg:#e6ebf0;--muted:#98a6b5;--line:#2f3a46;--sel:#4a2e17;--chip:#26303a;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#0f2238;--bg:#151a20;--panel:#1d242c;--fg:#e6ebf0;--muted:#98a6b5;--line:#2f3a46;--sel:#4a2e17;--chip:#26303a;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none}
/* ボタンやバーの上で 2 本指を使ってもページ全体が拡大されないように（拡大は 3D・図面の中だけ）。一覧・欄は縦スクロールだけ */
#dwg,#cbar,#hint{touch-action:none}
#top,#tools{touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch} #tools>*{flex:none}   /* スマホで横にずらして右の道具を出す（香月さん） */
#list,#card,#drawer,#load{touch-action:pan-y}
#top{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));min-height:48px}
#top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis}
#top .tb{flex:none}
#top h1 small{font-weight:400;opacity:.75;margin-left:6px}
#top .sp{flex:1}
.tb{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--bar-fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;min-height:36px;cursor:pointer}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tb:focus-visible,.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#b9bfc6,#d3d7dc)}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #0a5cff;border-radius:50%;background:rgba(255,255,255,.85)}
.mk.c1{border-radius:50%;box-shadow:0 0 0 3px rgba(10,92,255,.25)}
.mk.c0{border-radius:2px}
.mk.pv{width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid #e8711a;border-radius:50%;background:rgba(232,113,26,.25)}
.mk.pv span{background:#e8711a}
.mk span{position:absolute;left:12px;top:-6px;font-size:11px;white-space:nowrap;background:#0a5cff;color:#fff;padding:1px 5px;border-radius:3px}
.lb{position:absolute;transform:translate(-50%,-115%);background:#1d2733;color:#fff;border-radius:5px;padding:3px 7px;font-family:var(--f-num);font-size:13px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lb b{font-size:14px}
.lb i{font-style:normal;opacity:.75;font-size:11px;display:block}
#tools{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:calc(100% - 24px);overflow-x:auto}
.tool{border:0;background:transparent;color:var(--fg);border-radius:8px;min-width:58px;min-height:52px;padding:4px 6px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sw i{font-style:normal;font-size:11.5px;padding:3px 6px;color:var(--muted)}
.sw i.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(29,39,51,.86);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:16px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#card{position:absolute;right:12px;top:12px;width:300px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 110px);overflow:auto}
#cbar{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 24px);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:4;font-size:14px}
#cbar .btn{min-height:44px;min-width:72px}
#spd{position:absolute;right:12px;top:12px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;max-width:calc(100% - 24px);touch-action:none}
#srch{position:absolute;right:12px;top:12px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:10px 12px;display:flex;flex-direction:column;gap:6px;width:420px;max-width:calc(100% - 24px);box-sizing:border-box}
#fq{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 10px;font:inherit;font-size:16px}
#srch .k{color:var(--muted);font-size:12px}
#vw{position:absolute;right:12px;top:12px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px;max-width:calc(100% - 24px)}
#vw .vg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#vw .k{color:var(--muted);font-size:11.5px}
#vw .btn{min-height:40px;min-width:64px}
#spd b{font-family:var(--f-num);color:var(--accent);font-size:16px}
#spd .k{color:var(--muted);font-size:11.5px;white-space:nowrap}
#bgC{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
#spd .bgp{min-height:32px;padding:4px 9px;font-size:12.5px}
#spdR{width:180px;max-width:50vw;accent-color:var(--accent);min-height:32px}
#card h2{margin:0;font-size:17px;font-family:var(--f-num);letter-spacing:.02em}
#card .k{color:var(--muted);font-size:11.5px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px}
#card dt{color:var(--muted)} #card dd{margin:0;font-family:var(--f-num);min-width:0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;min-height:36px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
#drawer{position:absolute;left:0;top:0;bottom:0;width:300px;max-width:85%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:4px 0 16px rgba(0,0,0,.12);z-index:3}
#drawer header{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#drawer header .row{align-items:center;justify-content:space-between}
#q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px}
#list{flex:1;overflow:auto;padding:4px 0}
#list button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;color:var(--fg);text-align:left;padding:9px 14px;font-family:var(--f-num);font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
#list button[aria-current="true"]{background:var(--sel)}
#list .d{margin-left:auto;font-family:var(--f-ui);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5}
#load div{width:min(420px,calc(100% - 48px));display:flex;flex-direction:column;gap:10px;font-size:14px}
#load .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#dwg{position:fixed;inset:0;z-index:10;background:var(--dv-bg);display:flex;flex-direction:column}
#dwg header{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));min-height:48px}
#dwg header b{font-family:var(--f-num);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dwgbox{flex:1;position:relative;min-height:0}
@media (max-width:600px){.tb{padding:6px 8px;font-size:12.5px} #top{gap:6px} .tool{min-width:50px;font-size:10.5px} #tools{gap:2px;padding:4px} #card{left:12px;right:12px;top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:auto;max-height:34%;padding:8px 10px;gap:6px} #card h2{font-size:15px} #card .btn{min-height:34px;padding:5px 9px;font-size:12.5px} #hint{font-size:11.5px;padding:4px 10px} .tool{min-width:52px} #top h1 small{display:none}}
@media (max-width:600px){#top h1{display:none} #top{overflow-x:auto} #top .tb{flex:none}}
@media (max-width:480px){#top{gap:3px;padding-left:6px;padding-right:6px} .tb{padding:6px 6px}}
@media (prefers-reduced-motion:reduce){#load .bar i{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@400;600&display=swap">

<div id="app">
  <div id="top">
    <button class="tb" id="bList" aria-pressed="false">製品一覧</button>
    <h1>鉄骨ビューア<small>試作</small></h1>
    <span class="sp"></span>
    <button class="tb" id="bShow" hidden>再表示</button>
    <button class="tb" id="bBolt" aria-pressed="false">ボルト</button>
    <button class="tb" id="bFind" aria-pressed="false">検索</button>
    <button class="tb" id="bSpd" aria-pressed="false">設定</button>
    <button class="tb" id="bView" aria-pressed="false">視点</button>
    <button class="tb" id="bAll">全体</button>
    <button class="tb" id="bData">データ</button>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="ov"></div>
    <div id="hint">読み込み中…</div>
    <div id="card" hidden></div>
    <div id="srch" hidden><form id="fForm" class="row" style="flex-wrap:nowrap"><input id="fq" type="search" placeholder="製品マーク・部材マーク（例 TLT-1）" autocomplete="off" enterkeyhint="search"><button class="btn pri" type="submit">検索</button><button class="btn" type="button" id="fClr">解除</button></form><span id="fRes" class="k"></span></div>
    <div id="spd" hidden><label for="spdR">ズームの速さ <b id="spdV">4</b></label><div class="row" style="align-items:center;flex-wrap:nowrap"><span class="k">遅い 1</span><input type="range" id="spdR" min="1" max="10" step="1" value="4"><span class="k">10 速い</span></div>
      <label for="bgC">背景の色</label><div class="row" style="align-items:center"><input type="color" id="bgC" value="#c6cbd1"><button class="btn bgp" data-c="#c6cbd1" type="button">グレー</button><button class="btn bgp" data-c="#e9edf1" type="button">明るい</button><button class="btn bgp" data-c="#ffffff" type="button">白</button><button class="btn bgp" data-c="#2b3038" type="button">黒</button></div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="edgeC" checked style="width:20px;height:20px;accent-color:var(--accent)"> 全体に角の線を出す（重い）</label></div>
    <div id="vw" hidden><span class="k">見る向き（平行で表示。回すと元の見え方）</span><div class="vg"><button class="btn" type="button" data-v="0,0,1">上から</button><button class="btn" type="button" data-v="0,1,0">北から</button><button class="btn" type="button" data-v="1,0,0">東から</button><button class="btn" type="button" data-v="0,0,-1">下から</button><button class="btn" type="button" data-v="0,-1,0">南から</button><button class="btn" type="button" data-v="-1,0,0">西から</button></div></div>
    <div id="cbar" hidden><span id="cbarT"></span><div class="row"><button class="btn pri" id="cOk">決定</button><button class="btn" id="cNext">次の候補</button><button class="btn" id="cNo">取消</button></div></div>
    <div id="tools" role="toolbar" aria-label="道具">
      <button class="tool" data-mode="sel" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l12 8-6 1.5L8.5 19z"/></svg>選択</button>
      <button class="tool" id="bKind" title="選ぶ物の切り替え（製品／部材）"><span class="sw"><i data-k="asm">製品</i><i data-k="part">部材</i></span>選ぶ物</button>
      <button class="tool" data-mode="dist" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 17L17 3M6 20l14-14M5 12l2 2M9 8l2 2M13 4l2 2"/></svg>寸法</button>
      <button class="tool" data-mode="vert" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4M4 21h16"/></svg>鉛直</button>
      <button class="tool" data-mode="edist" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h16M4 20h16M12 7v10M9 10l3-3 3 3M9 14l3 3 3-3"/></svg>辺の間</button>
      <button class="tool" data-mode="fang" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 18l9-4 9 4M12 14V3M3 18V9l9-6"/></svg>面角度</button>
      <button class="tool" data-mode="axd" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 9h12M3 15h12M15 6v12M5 12h14M16 9l3 3-3 3"/></svg>材軸距離</button>
      <button class="tool" id="bClear"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>消す</button>
    </div>
    <aside id="drawer" hidden>
      <header>
        <div class="row"><b>製品一覧</b><button class="btn" id="bListClose">閉じる</button></div>
        <input id="q" type="search" placeholder="製品マークで探す（例 TLT-1）" autocomplete="off">
        <label class="k" style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)"><input type="checkbox" id="onlyDwg" checked> 図面のある製品だけ</label>
      </header>
      <div id="list"></div>
    </aside>
    <div id="load"><div><b id="ldT">データを確認しています</b><div class="bar"><i id="pg"></i></div><span id="pgt" class="k">準備中</span><div id="pick" class="row" hidden><label class="btn pri" id="bPick" for="fileIn" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px">データを開く（Box から選ぶ）</label></div><p id="pickHelp" class="k" hidden>Box の「アプリ試作データ」にある <b>鉄骨ビューア_データ.bin</b> を選んでください。ボルトも見る時は <b>鉄骨ビューア_ボルト.bin</b> も一緒に選べます。一度開くと、この端末に覚えます。</p><div id="kSel" hidden></div><input type="file" id="fileIn" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:0;top:0"></div></div>
  </div>
</div>
<div id="dwg" hidden>
  <header><button class="tb" id="bDwgClose">← 3D に戻る</button><b id="dwgName"></b><span id="dwgSw" class="row"></span></header>
  <div id="dwgbox"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* 製品図（DWG を変換した JSON）の 2D ビューア。window.DwgView
   DwgView.open(container, url)  … url は .json.gz（fetch → gzip 展開 → JSON）
   DwgView.close() / DwgView.setMode('pan'|'dist'|'angle') / DwgView.fit() / DwgView.clear()
   CSS：.dv- で始まるクラス。色は --dv-bg, --dv-fg, --dv-accent */
(function () {
  'use strict';
  // ---- AutoCAD インデックス色 ----
  function hsv(h, s, v) {
    var f = function (n) { var k = (n + h / 60) % 6; return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); };
    return 'rgb(' + Math.round(f(5) * 255) + ',' + Math.round(f(3) * 255) + ',' + Math.round(f(1) * 255) + ')';
  }
  var ACI = [];
  (function () {
    var base = ['#000', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff', '#ffffff', '#808080', '#c0c0c0'];
    for (var i = 0; i < 10; i++) ACI[i] = base[i];
    var vv = [1, 1, 0.8, 0.8, 0.6, 0.6, 0.5, 0.5, 0.3, 0.3];
    for (i = 10; i < 250; i++) {
      var hue = Math.floor((i - 10) / 10) * 15, k = i % 10;
      ACI[i] = hsv(hue, k % 2 ? 0.5 : 1, vv[k]);
    }
    var g = [0.2, 0.31, 0.41, 0.51, 0.75, 1];
    for (i = 250; i < 256; i++) ACI[i] = hsv(0, 0, g[i - 250]);
    ACI[7] = '#ffffff';
  })();
  function col(c) { return ACI[c] || '#999'; }

  var CSS = '' +
    '.dv-wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}' +
    '.dv-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}' +
    '.dv-bar{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}' +
    '.dv-btn{pointer-events:auto;min-height:40px;min-width:52px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);' +
    'background:var(--dv-bg,#1d232b);color:var(--dv-fg,#e8edf2);font:600 14px/1 system-ui,sans-serif;cursor:pointer}' +
    '.dv-btn[aria-pressed="true"]{background:var(--dv-accent,#ff8a1f);color:#111;border-color:transparent}' +
    '.dv-btn:focus-visible{outline:2px solid var(--dv-accent,#ff8a1f);outline-offset:2px}' +
    '.dv-info{position:absolute;left:8px;right:8px;bottom:8px;padding:8px 12px;border-radius:8px;background:rgba(17,21,27,.86);' +
    'color:var(--dv-fg,#e8edf2);font:500 14px/1.45 system-ui,sans-serif;font-variant-numeric:tabular-nums;pointer-events:none;min-height:20px}' +
    '.dv-info b{color:var(--dv-accent,#ff8a1f);font-size:16px}' +
    '.dv-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font:500 15px system-ui,sans-serif}' +
    '.dv-cbar{position:absolute;left:50%;transform:translateX(-50%);bottom:60px;max-width:calc(100% - 24px);background:#1d232b;border:2px solid var(--dv-accent,#ff8a1f);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff;font:500 14px system-ui,sans-serif;z-index:2}' +
    '.dv-cbar[hidden]{display:none}.dv-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dv-ok{background:var(--dv-accent,#ff8a1f);color:#111}';
  function injectCss() {
    if (document.getElementById('dv-css')) return;
    var s = document.createElement('style'); s.id = 'dv-css'; s.textContent = CSS; document.head.appendChild(s);
  }

// 部材の体積と重心（形の体積、孔・切欠込み）

function onTap(x,y,touch,add){

    const e=S.els[id]; if (S.selKind==='part') selectPart(id, add); else selectAsm(e.asm, false, add);
    // 外した時は、最後に選んだ物の欄を出す（無ければ閉じる）
    if (S.selKind==='part') showCard(S.selPart); else showCard(S.selAsms.includes(e.asm) ? id : -1);
    return;
  }
  if (S.mode==='erase'){   // 線消し：タップした所に一番近い線
    const r=cv.getBoundingClientRect(), mx=x-r.left, my=y-r.top, R=touch?32:16; let best=-1, bd=R;

  }

      const L=snapList(x,y,true); if (!L.length){ hint('ここには吸い付く点がありません'); return; }

  }
  if (S.mode==='axd'){   // 材軸距離：1 つ目は点、2 つ目は材軸にする部材、3 つ目は辺か点
    if (!S.pend){

      const sn=snap(x,y,false); if (!sn) return; axTake(sn); return;

    if (!S.pend.u){   // 部材をタップ：マウスはすぐ決定、指は確認（周りの部材も候補に）
      const id=pickId(x,y); if (id<0||id>=S.els.length){ hint('材軸にする部材をタップ'); return; }
      if (!touch){ endCand(); axTake({mem:id}); return; }
      const ids=[id]; for (const [dx,dy] of [[20,0],[-20,0],[0,20],[0,-20]]){ const j=pickId(x+dx,y+dy); if (j>=0 && j<S.els.length && !ids.includes(j)) ids.push(j); }
      S.cand={list:ids.map(j=>({mem:j})), i:0}; showCand(); return;
    }
    const L=axList(x,y,touch); if (!L.length){ hint('ここには辺も点もありません'); return; }
    if (touch){ S.cand={list:L, i:0}; showCand(); return; }
    axTake(L[0]); return;
  }
  if (S.mode==='eang' || S.mode==='edist'){
    const ed=nearEdge(x,y,touch); if (!ed){ if (touch) hint('ここには辺がありません'); return; }
    if (touch){ S.cand={kind:'edge', v:ed}; showCand(); return; }
    takeEdge(ed); return;

      tapWait={x,y,t:performance.now(),run,timer:setTimeout(run,300)}; }
  }
  down=null; });
// 平行（遠近なし）：見える大きさは変えずに、画角を 0.5° にして遠くから見る。回すとふつうの見え方に戻る
const FOV_P=45, FOV_O=0.5;
function setOrtho(on, back){
  if (!!S.ortho===!!on) return;
  const off=camera.position.clone().sub(controls.target), d=off.length();
  const h=d*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), fov=on?FOV_O:FOV_P, nd=h/Math.tan(THREE.MathUtils.degToRad(fov/2));
  camera.fov=fov; camera.position.copy(controls.target).addScaledVector(off.normalize(), nd);
  // 手前を切る面は空間に固定（平行にした時の元のカメラの位置）。拡大しても一緒に近づかない（近づくと部材が切れてフランジの厚みが無く見えた：香月さん 2026/10/15）
  const vd=off.clone().normalize();
  S.ortho = on ? {dir:vd, c0:controls.target.clone().addScaledVector(vd, back||d)} : null;
  if (!on) holdLight(false);
  camera.updateProjectionMatrix(); controls.update(); fitDepth(); req();
}
function faceView(x,y){
  const id=pickId(x,y); if (id<0||id>=S.els.length){ hint('面の上でダブルクリック（ダブルタップ）してください'); return; }
  setOrtho(false);
  const h=hitEl(id,x,y); if (!h||!h.n) return;
  holdLight(true);
  const n=h.n.clone(); if (n.dot(camera.position.clone().sub(h.p))<0) n.negate();   // 今見ている側から
  const dist=camera.position.distanceTo(controls.target);
  const t0=controls.target.clone(), p0=camera.position.clone(), t1=h.p.clone(), p1=h.p.clone().addScaledVector(n,dist);
  if (Math.abs(n.z)>0.999) p1.add(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1).multiplyScalar(-dist*1e-4));   // 真上・真下は今の向きのまま
  // 回転の中心は向いた面の点に（固定していたら解除）
  if (S.pivot) setPivot(null);
  const st0=performance.now(), T=350;
  (function step(){ const k=Math.min(1,(performance.now()-st0)/T), s=k*k*(3-2*k);
    // 中心から見た向きを球面で補間（まっすぐ線で動かすと途中で近づきすぎる）
    const d0=p0.clone().sub(t0), d1=p1.clone().sub(t1), L=d0.length()+(d1.length()-d0.length())*s;
    const dir=d0.normalize().lerp(d1.normalize(),s); if (dir.lengthSq()<1e-9) dir.copy(d1);
    controls.target.copy(t0).lerp(t1,s); camera.position.copy(controls.target).addScaledVector(dir.normalize(),L);
    controls.update(); fitDepth(); req(); if (k<1) requestAnimationFrame(step); else setOrtho(true, dist); })();
  hint('面に正面から向けました（平行に表示。回すと元の見え方に戻ります）');
}
cv.addEventListener('pointercancel', ()=>{ down=null; });
cv.addEventListener('pointermove', e=>{
  if (e.pointerType!=='mouse' || e.buttons) return;
  if (S.mode==='eang' || S.mode==='edist' || (S.mode==='vert' && S.pend)){ if (hoverMk) showHover(null); const x=e.clientX, y=e.clientY; clearTimeout(raf); raf=setTimeout(()=>showEdgeHover(nearEdge(x,y,false)), 50); return; }
  if (S.mode==='axd' && S.pend && !S.pend.u){ if (hoverMk) showHover(null); if (edgeHover) showEdgeHover(null); return; }   // 部材を選ぶ間は吸い付きを出さない
  if (S.mode==='axd' && S.pend){   // 材軸距離の 3 つ目：近い方（辺か点）を先に見せる
    const x=e.clientX, y=e.clientY; clearTimeout(raf);
    raf=setTimeout(()=>{ const c=axList(x,y,false)[0]; if (c && c.ed){ showHover(null); showEdgeHover(c.ed); } else { showEdgeHover(null); showHover(c||null); } }, 50); return;
  }
  if (edgeHover) showEdgeHover(null);
  if (S.mode!=='dist' && S.mode!=='line' && S.mode!=='vert' && S.mode!=='axd'){ if (hoverMk) showHover(null); return; }
  const x=e.clientX, y=e.clientY; clearTimeout(raf); raf=setTimeout(()=>showHover(snap(x,y,false)), 50);
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ clearPend(); hint(); } });
// ---------- 指 1 本の回転：指を置いた所の点を中心に回す。長押しで中心を固定（香月さん） ----------
controls.touches.ONE = -1;   // 1 本指の回転は下の処理で（2 本指の拡大・移動は今まで通り）
const ptrs1 = new Map(); let rot = null, lpTimer = 0;
function hitPoint(x,y){ const id=pickId(x,y); if (id<0||id>=S.els.length) return null; const h=hitEl(id,x,y); return h?h.p:null; }
function setPivot(p){
  S.pivot = p;
  if (!S.pivotMk){ S.pivotMk={div:mkDiv('mk pv'), p:null}; S.pivotMk.div.innerHTML='<span>回転の中心</span>'; }
  S.pivotMk.p = p; S.pivotMk.div.hidden = !p; req();
}
function orbitAround(P, yaw, pitch){
  const off=camera.position.clone().sub(controls.target), dir=off.clone().normalize();
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).normalize();
  // 真上・真下を越えないように
  const pol=Math.acos(Math.max(-1,Math.min(1,dir.z))); if (pol+pitch<0.03 || pol+pitch>Math.PI-0.03) pitch=0;
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), yaw).multiply(new THREE.Quaternion().setFromAxisAngle(right, pitch));
  for (const v of [camera.position, controls.target]) v.sub(P).applyQuaternion(q).add(P);
  controls.update(); fitDepth(); req();
}
cv.addEventListener('pointerdown', e=>{
  if (e.pointerType==='mouse') return;
  ptrs1.set(e.pointerId, [e.clientX, e.clientY]);
  clearTimeout(lpTimer);
  if (ptrs1.size!==1){ rot=null; return; }
  const x=e.clientX, y=e.clientY;
  rot={x, y, sx:x, sy:y, moved:false, pivot: S.pivot || hitPoint(x,y) || controls.target.clone()};
  // 長押し（0.55 秒動かさない）で回転の中心を固定／解除
  lpTimer=setTimeout(()=>{ if (!rot || rot.moved || ptrs1.size!==1) return; if (down) down.long=true;
    const p=hitPoint(x,y); if (!p || (S.pivot && S.pivot.distanceTo(p)<camera.position.distanceTo(p)*0.02)){ setPivot(null); hint('回転の中心を解除しました'); }
    else { setPivot(p); hint('ここを中心に回します（もう一度長押しで解除）'); } }, 550);
});
cv.addEventListener('pointermove', e=>{
  if (e.pointerType==='mouse' || !ptrs1.has(e.pointerId)) return;
  ptrs1.set(e.pointerId, [e.clientX, e.clientY]);
  if (!rot || ptrs1.size!==1) return;
  const dx=e.clientX-rot.x, dy=e.clientY-rot.y;
  if (!rot.moved && Math.hypot(e.clientX-rot.sx, e.clientY-rot.sy) < 8) return;
  if (!rot.moved) setOrtho(false);   // 指で回し始めたら平行をやめる
  rot.moved=true; clearTimeout(lpTimer); rot.x=e.clientX; rot.y=e.clientY;
  // 速さ：指は 0.5、近づいても変えない。「この製品だけ」の時は 0.7 倍
  const f=S.iso ? 0.7 : 1;
  const k=2*Math.PI/Math.max(cv.clientHeight,1)*0.5*f;
  orbitAround(rot.pivot, -dx*k, -dy*k);
});
// マウスの回転（左・右ドラッグ）：回転の中心を決めてある時はその点のまわりに回す
let mrot=null;
cv.addEventListener('pointerdown', e=>{
  if (e.pointerType!=='mouse' || !S.pivot || (e.button!==0 && e.button!==2) || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  mrot={x:e.clientX, y:e.clientY}; controls.enableRotate=false;
}, {capture:true});
window.addEventListener('pointermove', e=>{
  if (!mrot || e.pointerType!=='mouse') return;
  const dx=e.clientX-mrot.x, dy=e.clientY-mrot.y; mrot.x=e.clientX; mrot.y=e.clientY;
  const k=2*Math.PI/Math.max(cv.clientHeight,1)*controls.rotateSpeed;
  orbitAround(S.pivot, -dx*k, -dy*k);
});
window.addEventListener('pointerup', e=>{ if (mrot && e.pointerType==='mouse'){ mrot=null; controls.enableRotate=true; } });
cv.addEventListener('contextmenu', e=>e.preventDefault());
const endPtr=e=>{ if (e.pointerType==='mouse') return; ptrs1.delete(e.pointerId); clearTimeout(lpTimer); if (ptrs1.size===0) rot=null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
// iPhone・iPad の 2 本指でページが拡大されるのも止める（拡大は 3D・図面の中で）
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if (e.touches.length>1 && !e.target.closest('#cv,.dv-wrap')) e.preventDefault(); }, {passive:false});
boot();
</script>

</body></html>
